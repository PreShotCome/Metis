# Builds a signed Metis release APK and ships it to testers via
# Firebase App Distribution. Distribution-only — the app itself uses no
# Firebase SDK and needs no google-services.json.
#
# Fully self-contained: this workflow generates the Android project and
# signs the APK with your release keystore. You do NOT need Flutter or
# Android Studio installed locally — only the repo secrets below.
#
# Required GitHub repo secrets (Settings -> Secrets and variables -> Actions
# -> Secrets tab; NOT the Variables tab):
#   KEYSTORE_BASE64           base64 of your metis.jks signing keystore
#   KEY_STORE_PASSWORD        keystore password
#   KEY_ALIAS                 signing key alias
#   KEY_PASSWORD              password for that key alias
#   FIREBASE_APP_ID           Firebase Android App ID (1:NNN:android:XXXX)
#   FIREBASE_SERVICE_ACCOUNT  full JSON of a Firebase service account key
#   FIREBASE_TESTERS          comma-separated tester emails
#
# The APK applicationId is patched to com.metis.app to match the Firebase
# Android app's package name.

name: Build & Distribute Metis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          ok=1
          for s in KEYSTORE_BASE64 KEY_STORE_PASSWORD KEY_ALIAS KEY_PASSWORD FIREBASE_APP_ID FIREBASE_SERVICE_ACCOUNT FIREBASE_TESTERS; do
            v="${!s}"
            if [ -n "$v" ]; then
              echo "OK       $s  (${#v} chars)"
            else
              echo "MISSING  $s"
              ok=0
            fi
          done
          if [ "$ok" != 1 ]; then
            echo ""
            echo "One or more required secrets are not set (or are named differently)."
            echo "Add them under: Settings -> Secrets and variables -> Actions -> Secrets tab."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Generate Android project
        run: flutter create --platforms=android --org com.metis .

      - name: Patch Android build config
        run: |
          GRADLE=android/app/build.gradle.kts
          # NDK version required by the plugins
          sed -i 's|ndkVersion = .*|ndkVersion = "27.0.12077973"|' "$GRADLE"
          # minSdk 23 required by flutter_foreground_task
          sed -i 's|minSdk = .*|minSdk = 23|' "$GRADLE"
          # applicationId must match the Firebase Android app's package name
          sed -i 's|applicationId = .*|applicationId = "com.metis.app"|' "$GRADLE"
          # Core library desugaring required by flutter_local_notifications
          sed -i 's|compileOptions {|compileOptions {\n        isCoreLibraryDesugaringEnabled = true|' "$GRADLE"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$GRADLE"
          echo '----- android/app/build.gradle.kts -----'
          cat "$GRADLE"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Sign APK with release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > metis.jks
          echo "Decoded keystore size: $(wc -c < metis.jks) bytes"
          if [ ! -s metis.jks ]; then
            echo "ERROR: the KEYSTORE_BASE64 secret is empty or missing."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if ! keytool -list -keystore metis.jks -storepass "$KEY_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "ERROR: keystore could not be opened."
            echo "KEYSTORE_BASE64 is corrupt or KEY_STORE_PASSWORD is wrong."
            exit 1
          fi
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign \
            --ks metis.jks \
            --ks-pass "pass:$KEY_STORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$APK"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metis-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Distribute to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "Metis — always listening, never forgetting. | ${{ github.sha }}"
